apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def reactNativeArchitectures() {
  def value = rootProject.findProperty("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

android {
  namespace "com.margelo.nitro.timeractivity"
  compileSdk 36

  defaultConfig {
    minSdk 24
    consumerProguardFiles 'consumer-rules.pro'
    externalNativeBuild {
      cmake {
        cppFlags "-O2", "-frtti", "-fexceptions", "-Wall", "-std=c++20"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake { path "CMakeLists.txt" }
  }

  buildFeatures { prefab true }

  packagingOptions {
    excludes += [
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libreactnative.so",
      "**/libhermes.so"
    ]
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
}

apply from: "$projectDir/../nitrogen/generated/android/NitroTimerActivity+autolinking.gradle"
